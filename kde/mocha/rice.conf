# ---------------------------------------------------------------------------
#  kde-mocha-rice — suas escolhas
#  Mude aqui e rode ./install.sh de novo. Tudo o mais lê deste arquivo.
# ---------------------------------------------------------------------------

# Sabor do Catppuccin: mocha (escuro), macchiato, frappe ou latte (claro)
FLAVOR="mocha"

# Cor de destaque: rosewater flamingo pink mauve red maroon peach yellow
#                  green teal sky sapphire blue lavender
ACCENT="mauve"

# Fontes (baixadas para ~/.local/share/fonts, sem sudo)
FONTE_INTERFACE="Inter"
FONTE_MONO="JetBrainsMono Nerd Font"
TAMANHO_FONTE=10

# Velocidade das animações do KDE (1.0 = padrão; menor = mais rápido)
VELOCIDADE_ANIMACAO=0.7

# Wallpaper (arquivo em assets/wallpapers/)
WALLPAPER="mocha-montanhas.jpg"
WALLPAPER_BLOQUEIO="mocha-aurora.jpg"

# Painéis: "topo+dock" (barra fina no topo e dock embaixo) ou "nao" (não mexe)
PAINEL="topo+dock"
# Programas fixados na dock (arquivos .desktop)
DOCK_APPS="org.kde.dolphin.desktop,firefox.desktop,Alacritty.desktop,org.kde.discover.desktop,systemsettings.desktop"

# Atalho do lançador Vicinae (estilo Raycast)
ATALHO_LANCADOR="Meta+Space"

# Áreas de trabalho virtuais
AREAS_DE_TRABALHO=4

# Cantos arredondados nas janelas (precisa do pacote kwin-effect-rounded-corners)
RAIO_CANTOS=12

# Animação de abrir/fechar janelas (Burn My Windows). Opções:
#   kwin6_effect_aura_glow  kwin6_effect_wisps  kwin6_effect_glide  kwin6_effect_focus
#   kwin6_effect_energize_a kwin6_effect_portal kwin6_effect_tv     kwin6_effect_fire ...
#   ou "glide" / "scale" (efeitos nativos do KDE)
EFEITO_JANELA="kwin6_effect_aura_glow"

# Janelas "gelatina" ao arrastar (true/false)
JANELAS_GELATINA="false"
